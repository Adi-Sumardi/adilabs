# Nginx — adilabs.id (path-based: /api/* → backend, /uploads/* → backend, rest → static)
server {
  listen 80;
  listen [::]:80;
  server_name adilabs.id www.adilabs.id;
  return 301 https://adilabs.id$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name adilabs.id;

  ssl_certificate     /etc/letsencrypt/live/adilabs.id/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/adilabs.id/privkey.pem;

  root /var/www/adilabs;
  index Portfolio.html;

  # API
  location /api/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Uploaded images served by backend (also has 30d cache headers)
  location /uploads/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_set_header Host $host;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # SEO endpoints proxied to backend
  location = /rss.xml     { proxy_pass http://127.0.0.1:3001/api/rss; }
  location = /sitemap.xml { proxy_pass http://127.0.0.1:3001/api/sitemap; }

  # Friendly URLs
  location = /            { try_files /Portfolio.html =404; }
  location = /ai-workshop { try_files /ai-workshop.html =404; }
  location = /admin       { try_files /admin/admin.html =404; }
  location ~ ^/blog/(.+)$ { try_files /blog.html =404; }

  # Static assets
  location / { try_files $uri $uri/ =404; }

  # Cache headers for static
  location ~* \.(?:css|js|png|jpg|jpeg|webp|svg|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public";
  }
}
